<svg xmlns="http://www.w3.org/2000/svg" class="char c-tock " data-char="H200" viewBox="0 0 120 130" role="img" aria-label="Tock"><style>/* Hourly cast motion. Shared by the app and the cast sheet. */
.char { overflow: visible; display: block; }
.char .pupil, .char .arm, .char .brows, .char .mouth { transform-box: fill-box; }
.char { animation: cfloat 4.6s ease-in-out infinite; transform-origin: 50% 90%; }
.c-tock { animation-duration: 5.2s; animation-delay: -1.2s; } .c-flux { animation-duration: 3.9s; animation-delay: -2.1s; } .c-gramps { animation-duration: 6s; animation-delay: -3s; }
@keyframes cfloat { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5%) rotate(2deg); } }
.char .pupil { animation: cblink 5.4s infinite, clook 7s ease-in-out infinite; transform-origin: 50% 50%; }
.c-tock .pupil { animation-delay: -1.5s, -2s; } .c-flux .pupil { animation-delay: -3s, -1s; } .c-gramps .pupil { animation-delay: -4s, -3s; }
@keyframes cblink { 0%,92%,100% { scale: 1 1; } 95% { scale: 1 .08; } }
@keyframes clook { 0%,30% { translate: 0 0; } 40%,60% { translate: 2.5px -1px; } 70%,90% { translate: -2.5px 1px; } 100% { translate: 0 0; } }
.char .hand { transform-box: view-box; transform-origin: 60px 68px; }
.char .hand.m { animation: cspin 14s linear infinite; } .char .hand.h { animation: cspin 168s linear infinite; }
@keyframes cspin { to { transform: rotate(360deg); } }
.char .arm { transform-origin: 50% 50%; }
.char .arm.l { transform-origin: 100% 100%; } .char .arm.r { transform-origin: 0% 100%; }
.char .brows { transition: transform .3s cubic-bezier(.22,1,.36,1); }
@keyframes cwave { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-28deg); } 75% { transform: rotate(12deg); } }
@keyframes cwaveR { 0%,100% { transform: rotate(0); } 25% { transform: rotate(28deg); } 75% { transform: rotate(-12deg); } }
@keyframes cjump { 0% { transform: translateY(0) scale(1); } 30% { transform: translateY(-14%) scale(1.04, .96); } 55% { transform: translateY(0) scale(.97, 1.03); } 100% { transform: translateY(0) scale(1); } }
.crow2:hover .char, .stage:hover .char { animation: cjump .7s cubic-bezier(.22,1,.36,1), cfloat 4.6s ease-in-out .7s infinite; }
.crow2:hover .arm.l, .crow2.on .arm.l, .stage:hover .arm.l { animation: cwave .9s ease-in-out infinite; }
.crow2:hover .arm.r, .crow2.on .arm.r, .stage:hover .arm.r { animation: cwaveR .9s ease-in-out .15s infinite; }
.crow2:hover .brows, .stage:hover .brows { transform: translateY(-3px); }
.crow2:hover .mouth, .stage:hover .mouth { transform: scale(1.2); transform-origin: 50% 0; }
@media (prefers-reduced-motion: reduce) { .char, .char * { animation: none !important; } }
