[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read", path = "./functions/settle.js" }, { access = "read-write", path = "./cache" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@switchboard-xyz/on-demand-solidity/=node_modules/@switchboard-xyz/on-demand-solidity/",
  "@chainlink/contracts/=node_modules/@chainlink/contracts/",
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 128
fail_on_revert = false

[lint]
lint_on_build = false
